name: Kokugo Playground benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ai-grading/run-playground-benchmark.mjs'
      - 'benchmarks/ai-grading/2024/solver-cases.json'
      - 'benchmarks/ai-grading/prompts/solver-v1.txt'
      - '.github/workflows/kokugo-playground-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright pdfjs-dist
          npx playwright install --with-deps chromium

      - name: Run 2024 Gemma benchmark through public Cloudflare Playground
        run: node benchmarks/ai-grading/run-playground-benchmark.mjs

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-playground-benchmark-${{ github.run_id }}
          path: benchmarks/ai-grading/results/2024-playground-gemma4-*.json
          if-no-files-found: warn
          retention-days: 7

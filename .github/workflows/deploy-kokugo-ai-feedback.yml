name: Deploy Kokugo AI feedback pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/kokugo-ai-feedback
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install pinned dependencies
        # Keep the reviewed lockfile exact. The runner's global pnpm policy otherwise
        # rejects newly published, integrity-locked Wrangler releases for 24 hours.
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - name: Run unit tests
        run: pnpm test
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.' >&2
            exit 2
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_AUTH_TOKEN" ]; then
            echo 'Cloudflare API token is not configured.' >&2
            exit 2
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_AUTH_TOKEN" >> "$GITHUB_ENV"
          fi
      - name: Validate bundle
        run: pnpm exec wrangler deploy --dry-run
      - name: Deploy public pilot
        run: pnpm exec wrangler deploy

name: Kokugo Qwen smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kokugo-qwen-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Adapt smoke runner to Qwen 3.8 27B
        run: |
          sed -i "s#const MODEL = '@cf/google/gemma-4-26b-a4b-it';#const MODEL = '@cf/qwen/qwen3.8-27b';#" benchmarks/ai-grading/playground-smoke.mjs
      - name: Open Qwen in public Cloudflare Playground and send short prompt
        run: node benchmarks/ai-grading/playground-smoke.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-qwen-smoke-${{ github.run_id }}
          path: benchmarks/ai-grading/results/
          if-no-files-found: warn
          retention-days: 3

name: Deploy kokugo v1.1.4

on:
  push:
    branches: ["main"]
    paths:
      - "trigger-v114.txt"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated v1.1.0 source
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.0-20260831
          mkdir -p /tmp/kokugo-src /tmp/v110-chunks
          git archive origin/deploy-v1.1.0-20260831 deploy-v110 | tar -x -C /tmp/v110-chunks
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, io, re, shutil, tarfile, json
          root=Path('/tmp/v110-chunks/deploy-v110')
          chunks=[]
          for p in sorted(root.glob('chunk*.txt')):
              s=re.sub(r'[^A-Za-z0-9+/=]','',p.read_text())
              chunks.append((p.name,s))
          idx=next(i for i,(n,_) in enumerate(chunks) if n=='chunk07.txt')
          original=chunks[idx][1]
          for label,c7 in [('drop-last',original[:-1]),('drop-first',original[1:])]:
              parts=[s for _,s in chunks]; parts[idx]=c7
              try:
                  data=base64.b64decode(''.join(parts), validate=True)
                  with gzip.GzipFile(fileobj=io.BytesIO(data)) as gz: tarbytes=gz.read()
                  with tarfile.open(fileobj=io.BytesIO(tarbytes),mode='r:') as tf:
                      names=tf.getnames(); pkg_member=next(n for n in names if n.rstrip('/').endswith('package.json'))
                      pkg=json.load(tf.extractfile(pkg_member)); main_member=next(n for n in names if n.rstrip('/').endswith('src/main.jsx'))
                      main=tf.extractfile(main_member).read().decode('utf-8')
                      profile_ok=any(n.rstrip('/').endswith('src/reviewProfiles.js') for n in names)
                      if pkg.get('version')!='1.1.0' or '1.1.0-source-specific-reviews' not in main or not profile_ok: raise RuntimeError('semantic validation failed')
                      out=Path('/tmp/kokugo-src'); shutil.rmtree(out,ignore_errors=True); out.mkdir(); tf.extractall(out)
                  print('selected v1.1.0 repair:',label); break
              except Exception as e: print(label,'failed:',repr(e))
          else: raise SystemExit('no repair produced a valid v1.1.0 source')
          PY

      - name: Apply validated v1.1.1 patch
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.1-patch
          rm -rf /tmp/v111-stage; mkdir -p /tmp/v111-stage
          git archive origin/deploy-v1.1.1-patch deploy-v111 | tar -x -C /tmp/v111-stage
          d=/tmp/v111-stage/deploy-v111
          cat "$d/patch00.txt" "$d/patch00-tail.txt" "$d/patch01.txt" "$d/patch02.txt" "$d/patch03.txt" "$d/patch04.txt" "$d/patch05a.txt" "$d/patch05b1.txt" "$d/patch05c.txt" "$d/patch05e.txt" "$d/patch05f.txt" > /tmp/v111-patch.b64
          base64 -d /tmp/v111-patch.b64 > /tmp/v111-patch.tar.gz
          echo '34c2958362a719a30a15243ddb63fecdb40f5f2bf5328585faf6b98446d6b782  /tmp/v111-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v111-patch.tar.gz -C /tmp/kokugo-src
          node -e "const p=require('/tmp/kokugo-src/package.json'); if(p.version!=='1.1.1') throw new Error('wrong version '+p.version)"

      - name: Apply validated v1.1.2 patch
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.2-patch
          rm -rf /tmp/v112-stage; mkdir -p /tmp/v112-stage
          git archive origin/deploy-v1.1.2-patch deploy-v112 | tar -x -C /tmp/v112-stage
          d=/tmp/v112-stage/deploy-v112
          cat "$d/chunk00.txt" "$d/chunk01.txt" "$d/chunk02.txt" "$d/chunk03.txt" > /tmp/v112-patch.b64
          base64 -d /tmp/v112-patch.b64 > /tmp/v112-patch.tar.gz
          echo '842b8e5862afd9eccf449508d6323d69406e0b61c63f8cee8771e8875d76ebca  /tmp/v112-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v112-patch.tar.gz -C /tmp/kokugo-src
          node -e "const p=require('/tmp/kokugo-src/package.json'); if(p.version!=='1.1.2') throw new Error('wrong version '+p.version)"

      - name: Apply validated v1.1.3 patch
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.3-patch
          rm -rf /tmp/v113-stage; mkdir -p /tmp/v113-stage
          git archive origin/deploy-v1.1.3-patch deploy-v113p | tar -x -C /tmp/v113-stage
          d=/tmp/v113-stage/deploy-v113p
          cat "$d"/v113p*.txt > /tmp/v113-patch.gz.b64
          base64 -d /tmp/v113-patch.gz.b64 > /tmp/v113.patch.gz
          echo '948ba9739e83a3ed9f0b9bf053199301a2dcf9767fcc0015c0364c2dc632592f  /tmp/v113.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v113.patch.gz > /tmp/v113.patch
          patch --batch -p4 -d /tmp/kokugo-src < /tmp/v113.patch
          node -e "const p=require('/tmp/kokugo-src/package.json'); if(p.version!=='1.1.3') throw new Error('wrong version '+p.version)"

      - name: Apply and validate v1.1.4 patch
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.4-patch2
          rm -rf /tmp/v114-stage; mkdir -p /tmp/v114-stage
          git archive origin/deploy-v1.1.4-patch2 deploy-v114r | tar -x -C /tmp/v114-stage
          d=/tmp/v114-stage/deploy-v114r
          cat "$d/chunk00.bin" "$d/chunk01.bin" "$d/chunk02.bin" "$d/chunk03.bin" > /tmp/v114-runtime-patch.tar.gz
          echo '693aa48637cea9678b85a71e69577e618a5dfd8e2b5a788ff111a0516bc786cd  /tmp/v114-runtime-patch.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v114-runtime-patch.tar.gz >/dev/null
          tar -xzf /tmp/v114-runtime-patch.tar.gz -C /tmp/kokugo-src --strip-components=1
          node -e "const p=require('/tmp/kokugo-src/package.json'); if(p.version!=='1.1.4') throw new Error('wrong version '+p.version)"
          grep -q "1.1.4-weakness-ledger" /tmp/kokugo-src/src/main.jsx

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and verify v1.1.4
        working-directory: /tmp/kokugo-src
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -f dist/index.html
          grep -R "1.1.4-weakness-ledger" dist/assets/*.js >/dev/null

      - name: Publish v1.1.4 over current site
        run: |
          set -euo pipefail
          cp -a /tmp/kokugo-src/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No publish changes"; exit 0; fi
          git commit -m "deploy: kokugo v1.1.4"
          git push origin main

name: Kokugo Qwen benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kokugo-qwen-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime dependencies
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright pdfjs-dist
          npx playwright install --with-deps chromium

      - name: Configure Qwen 3.8 and difficult Q2 single-run diagnostic
        shell: bash
        run: |
          sed -i "s#const MODEL = '@cf/google/gemma-4-26b-a4b-it';#const MODEL = '@cf/qwen/qwen3.8-27b';#" benchmarks/ai-grading/run-playground-benchmark.mjs
          sed -i "s#const MODEL_SLUG = 'gemma-4-26b-a4b-it';#const MODEL_SLUG = 'qwen3.8-27b';#" benchmarks/ai-grading/run-playground-benchmark.mjs
          sed -i "s/providerValue === 'Google'/providerValue === 'Qwen'/" benchmarks/ai-grading/run-playground-benchmark.mjs
          sed -i "s/provider !== 'Google'/provider !== 'Qwen'/" benchmarks/ai-grading/run-playground-benchmark.mjs
          sed -i "s/2024-playground-gemma4-/2024-playground-qwen38-q2-long-/" benchmarks/ai-grading/run-playground-benchmark.mjs
          sed -i 's/180_000/360_000/g' benchmarks/ai-grading/run-playground-benchmark.mjs
          cat > benchmarks/ai-grading/2024/solver-cases.json <<'JSON'
          {
            "schemaVersion": 7,
            "rules": {
              "officialAnswerMustBeHiddenFromModel": true,
              "evaluateAfterGeneration": true,
              "contextMode": "q2_focused_passage_long_timeout_diagnostic",
              "repeatRuns": 1,
              "diagnosticOnly": true
            },
            "source": {
              "problemPdf": "https://www.waseda-shibuya.edu.sg/assets/upload/files/e84fc32c4eac71d3616a4743a3bf47eb1712047203.pdf",
              "conversion": "pdfjs_runtime"
            },
            "cases": [
              {
                "id": "2024-2-6",
                "points": 10,
                "parts": [
                  {"id": "甲", "points": 5, "maxChars": 10},
                  {"id": "乙", "points": 5, "maxChars": 10}
                ],
                "passagePageIndexes": [16, 17, 18],
                "questionPageIndex": 25,
                "questionLocator": {
                  "start": "問六",
                  "end": "〈下書き用"
                }
              }
            ]
          }
          JSON

      - name: Run one long-timeout Q2 sample with Qwen 3.8 27B
        run: node benchmarks/ai-grading/run-playground-benchmark.mjs

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-qwen-q2-long-${{ github.run_id }}
          path: benchmarks/ai-grading/results/2024-playground-qwen38-q2-long-*.json
          if-no-files-found: warn
          retention-days: 7

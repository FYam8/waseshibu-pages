name: Kokugo Playground smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open Cloudflare Playground
        run: node benchmarks/ai-grading/playground-smoke.mjs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-playground-smoke-${{ github.run_id }}
          path: benchmarks/ai-grading/results/
          if-no-files-found: warn
          retention-days: 3

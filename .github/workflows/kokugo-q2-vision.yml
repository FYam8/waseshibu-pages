name: Kokugo Q2 vision diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/ai-grading/run-playground-vision-q2.mjs'
      - '.github/workflows/kokugo-q2-vision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q2-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright pdfjs-dist
          npx playwright install --with-deps chromium
      - name: Run Q2 visual-layout diagnostic
        run: node benchmarks/ai-grading/run-playground-vision-q2.mjs
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-q2-vision-${{ github.run_id }}
          path: benchmarks/ai-grading/results/2024-q2-vision-*.json
          if-no-files-found: warn
          retention-days: 7

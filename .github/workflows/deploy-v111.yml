name: Deploy kokugo v1.1.1

on:
  push:
    branches: ["main"]
    paths:
      - "trigger-v111.txt"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated v1.1.0 source
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.0-20260831
          mkdir -p /tmp/kokugo-src /tmp/v110-chunks
          git archive origin/deploy-v1.1.0-20260831 deploy-v110 | tar -x -C /tmp/v110-chunks
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, io, re, shutil, tarfile, json
          root=Path('/tmp/v110-chunks/deploy-v110')
          chunks=[]
          for p in sorted(root.glob('chunk*.txt')):
              s=re.sub(r'[^A-Za-z0-9+/=]','',p.read_text())
              chunks.append((p.name,s))
          idx=next(i for i,(n,_) in enumerate(chunks) if n=='chunk07.txt')
          original=chunks[idx][1]
          candidates=[('drop-last', original[:-1]), ('drop-first', original[1:])]
          for label,c7 in candidates:
              parts=[s for _,s in chunks]
              parts[idx]=c7
              try:
                  data=base64.b64decode(''.join(parts), validate=True)
                  with gzip.GzipFile(fileobj=io.BytesIO(data)) as gz:
                      tarbytes=gz.read()
                  with tarfile.open(fileobj=io.BytesIO(tarbytes),mode='r:') as tf:
                      names=tf.getnames()
                      pkg_member=next(n for n in names if n.rstrip('/').endswith('package.json'))
                      pkg=json.load(tf.extractfile(pkg_member))
                      main_member=next(n for n in names if n.rstrip('/').endswith('src/main.jsx'))
                      main=tf.extractfile(main_member).read().decode('utf-8')
                      profile_ok=any(n.rstrip('/').endswith('src/reviewProfiles.js') for n in names)
                      if pkg.get('version')!='1.1.0' or '1.1.0-source-specific-reviews' not in main or not profile_ok:
                          raise RuntimeError('semantic validation failed')
                      out=Path('/tmp/kokugo-src')
                      shutil.rmtree(out,ignore_errors=True); out.mkdir()
                      tf.extractall(out)
                  print('selected v1.1.0 repair:',label)
                  break
              except Exception as e:
                  print(label,'failed:',repr(e))
          else:
              raise SystemExit('no repair produced a valid v1.1.0 source')
          PY

      - name: Apply and validate v1.1.1 patch
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.1.1-patch
          rm -rf /tmp/v111-stage
          mkdir -p /tmp/v111-stage
          git archive origin/deploy-v1.1.1-patch deploy-v111 | tar -x -C /tmp/v111-stage
          d=/tmp/v111-stage/deploy-v111
          cat "$d/patch00.txt" "$d/patch00-tail.txt" "$d/patch01.txt" "$d/patch02.txt" "$d/patch03.txt" "$d/patch04.txt" "$d/patch05a.txt" "$d/patch05b1.txt" "$d/patch05c.txt" "$d/patch05e.txt" "$d/patch05f.txt" > /tmp/v111-patch.b64
          base64 -d /tmp/v111-patch.b64 > /tmp/v111-patch.tar.gz
          echo '34c2958362a719a30a15243ddb63fecdb40f5f2bf5328585faf6b98446d6b782  /tmp/v111-patch.tar.gz' | sha256sum -c -
          tar -tzf /tmp/v111-patch.tar.gz >/dev/null
          tar -xzf /tmp/v111-patch.tar.gz -C /tmp/kokugo-src
          node -e "const p=require('/tmp/kokugo-src/package.json'); if(p.version!=='1.1.1') throw new Error('wrong version '+p.version)"
          cd /tmp/kokugo-src
          node tools/test_review_quality_regressions.mjs
          node tools/test_version_consistency.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and verify v1.1.1
        working-directory: /tmp/kokugo-src
        run: |
          set -euo pipefail
          npm install
          npm run build
          test -f dist/index.html
          grep -R "1.1.1" dist/assets/*.js >/dev/null

      - name: Publish v1.1.1 over current site
        run: |
          set -euo pipefail
          cp -a /tmp/kokugo-src/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "deploy: kokugo v1.1.1"
          git push origin main

name: Deploy kokugo v1.0.5

on:
  push:
    branches: ["main"]
    paths:
      - "trigger-v105.txt"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore safe v1.0.5 source
        run: |
          set -euo pipefail
          git fetch origin deploy-v1.0.5-20260901
          mkdir -p /tmp/kokugo-src /tmp/v105-chunks
          git archive origin/deploy-v1.0.5-20260901 deploy-v105 | tar -x -C /tmp/v105-chunks
          cat /tmp/v105-chunks/deploy-v105/chunk*.txt | base64 -d | tar -xzf - -C /tmp/kokugo-src

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and verify v1.0.5
        working-directory: /tmp/kokugo-src
        run: |
          set -euo pipefail
          npm install
          npm run build
          grep -R "1.0.5-waseshibu-extended-drills" dist/assets/*.js

      - name: Publish over current site
        run: |
          set -euo pipefail
          cp -a /tmp/kokugo-src/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No publish changes"
            exit 0
          fi
          git commit -m "deploy: kokugo v1.0.5"
          git push origin main

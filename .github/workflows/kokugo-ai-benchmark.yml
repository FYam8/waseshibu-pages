name: Kokugo AI grader benchmark (2022-2026 compact input)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Workers AI model ID
        required: true
        default: '@cf/google/gemma-4-26b-a4b-it'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kokugo-ai-benchmark.yml'
      - 'benchmarks/ai-grading/run-workers-ai-grader.mjs'
      - 'benchmarks/ai-grading/2022-2026/grader-cases-v2.json'
      - 'benchmarks/ai-grading/prompts/grader-v2.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate five-year benchmark input
        run: BENCH_DRY_RUN=true node benchmarks/ai-grading/run-workers-ai-grader.mjs

  benchmark:
    # API inference is opt-in. Pull requests only run the validation job above.
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKERS_AI_MODEL: ${{ inputs.model }}
      BENCH_REPEAT: '1'
      BENCH_TEMPERATURE: '0'
      BENCH_THINKING: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.' >&2
            exit 2
          fi
          if [ -z "$CLOUDFLARE_AUTH_TOKEN" ] && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Neither CLOUDFLARE_AUTH_TOKEN nor CLOUDFLARE_API_TOKEN is configured.' >&2
            exit 2
          fi

      - name: Run compact 2022-2026 grader benchmark once
        shell: bash
        run: |
          node benchmarks/ai-grading/run-workers-ai-grader.mjs 2>&1 | tee "benchmarks/ai-grading/grader-five-year.log"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-grader-five-year-${{ github.run_id }}
          path: |
            benchmarks/ai-grading/results/
            benchmarks/ai-grading/grader-five-year.log
          if-no-files-found: warn
          retention-days: 7

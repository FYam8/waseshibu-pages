name: Kokugo AI benchmark (authenticated API)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kokugo-ai-benchmark.yml'
      - 'benchmarks/ai-grading/run-workers-ai.mjs'
      - 'benchmarks/ai-grading/2024/solver-cases.json'
      - 'benchmarks/ai-grading/prompts/solver-v1.txt'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gemma4
            model: '@cf/google/gemma-4-26b-a4b-it'
          - label: qwen38
            model: '@cf/qwen/qwen3.8-27b'
          - label: glm47flash
            model: '@cf/zai-org/glm-4.7-flash'
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKERS_AI_MODEL: ${{ matrix.model }}
      BENCH_REPEAT: '3'
      BENCH_TEMPERATURE: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install benchmark dependency
        run: npm install --no-save pdfjs-dist

      - name: Verify Cloudflare credentials are available
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured.' >&2
            exit 2
          fi
          if [ -z "$CLOUDFLARE_AUTH_TOKEN" ] && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Neither CLOUDFLARE_AUTH_TOKEN nor CLOUDFLARE_API_TOKEN is configured.' >&2
            exit 2
          fi

      - name: Run 2024 Kokugo benchmark
        shell: bash
        run: |
          node benchmarks/ai-grading/run-workers-ai.mjs 2>&1 | tee "benchmarks/ai-grading/benchmark-${{ matrix.label }}.log"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokugo-ai-${{ matrix.label }}-${{ github.run_id }}
          path: |
            benchmarks/ai-grading/results/
            benchmarks/ai-grading/benchmark-${{ matrix.label }}.log
          if-no-files-found: warn
          retention-days: 7
